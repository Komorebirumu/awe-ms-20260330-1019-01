<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .background { fill: #f4f7f6; }
    .primary { fill: #3f88c5; }
    .secondary { fill: #f8a5c2; }
    .accent { fill: #fca311; }
    .text-color { fill: #333; }
    .outline { stroke: #333; stroke-width: 2; fill: none; }
    .shadow { fill: rgba(0,0,0,0.1); }
  </style>

  <rect class="background" width="800" height="600"/>

  <!-- Main AI Icon -->
  <g transform="translate(300, 200)">
    <circle cx="100" cy="100" r="70" class="primary"/>
    <circle cx="100" cy="100" r="40" class="secondary"/>
    <path d="M 80 80 L 120 120 M 80 120 L 120 80" class="primary" stroke-width="8" stroke="#f4f7f6"/>
    <circle cx="100" cy="100" r="20" class="accent"/>
    <rect x="85" y="90" width="30" height="20" rx="5" class="accent"/>
  </g>

  <!-- Map Element (Stylized Globe/Map Icon) -->
  <g transform="translate(500, 250) scale(0.8)">
    <circle cx="0" cy="0" r="80" class="primary" stroke="#3f88c5" stroke-width="4"/>
    <path d="M -70 0 A 70 70 0 1 1 70 0 A 70 70 0 1 1 -70 0 Z" class="accent" stroke="#fca311" stroke-width="4"/>
    <circle cx="-40" cy="20" r="15" class="secondary"/>
    <circle cx="30" cy="-30" r="12" class="secondary"/>
    <circle cx="10" cy="40" r="10" class="secondary"/>
    <circle cx="-50" cy="-15" r="8" class="secondary"/>
  </g>

  <!-- Text: AI-Powered Niche Historical Map Stylizer -->
  <text x="400" y="80" text-anchor="middle" class="text-color" font-size="32" font-weight="bold">AI-Powered</text>
  <text x="400" y="130" text-anchor="middle" class="text-color" font-size="28">Niche Historical Map</text>
  <text x="400" y="170" text-anchor="middle" class="accent" font-size="30" font-weight="bold">Stylizer</text>

  <!-- Connecting Lines/Elements -->
  <line x1="350" y1="200" x2="450" y2="220" class="primary" stroke-width="4"/>
  <line x1="450" y1="220" x2="500" y2="250" class="primary" stroke-width="4"/>

  <!-- Small element suggesting "stylization" or "filters" -->
  <g transform="translate(400, 350) scale(0.6)">
    <circle cx="0" cy="0" r="20" class="outline"/>
    <circle cx="0" cy="0" r="15" class="secondary"/>
    <circle cx="0" cy="0" r="10" class="primary"/>
    <path d="M -15 -5 L 15 5 M -15 5 L 15 -5" class="outline" stroke-width="3"/>
    <path d="M 0 -20 L 0 -10" class="outline" stroke-width="3"/>
    <path d="M 0 10 L 0 20" class="outline" stroke-width="3"/>
    <path d="M -20 0 L -10 0" class="outline" stroke-width="3"/>
    <path d="M 10 0 L 20 0" class="outline" stroke-width="3"/>
  </g>

  <!-- Footer text (optional, smaller) -->
  <text x="400" y="550" text-anchor="middle" class="text-color" font-size="16">Transforming history into visually rich maps.</text>

</svg>